# 보스 디렉터 PPO 학습 설정. 실행은 train.ps1 (mlagents 1.1.0, Unity 패키지 com.unity.ml-agents 4.2.0).
# 한 결정 = 보스가 다음 패턴을 고르는 순간 한 번(패턴 + 다음 대기 5단계). 한 판 = 한 에피소드.
behaviors:
  BossDirector:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 300000
    time_horizon: 64
    summary_freq: 2000
    checkpoint_interval: 20000
    keep_checkpoints: 5

# 게임 시간은 프레임마다 1/60초로 고정하고(capture_frame_rate), 화면 없이 최대한 빨리 돌린다.
# time_scale을 올리면 한 프레임이 길어져 판정 창을 건너뛸 수 있어서 1로 둔다. 속도는 실행 파일 수(num_envs)로 낸다.
engine_settings:
  width: 160
  height: 90
  quality_level: 0
  time_scale: 1
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
